version: "3.8"

services:
  couchdb:
    image: couchdb:3.5.2
    container_name: couchdb-obsidian
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_ADMIN_USER}
      COUCHDB_PASSWORD: ${COUCHDB_ADMIN_PASSWORD}
    volumes:
      # Data volume — stored on the NAS. Change the host path to your own.
      - /Volume1/docker/couchdb-obsidian/data:/opt/couchdb/data
      # Config file — mounted read-only for security
      - ./couchdb/local.ini:/opt/couchdb/etc/local.d/local.ini
    # SECURITY: only listens on localhost — not directly reachable from outside.
    # Needed so admin scripts (setup-users.sh, compact-databases.sh) can run from the host.
    ports:
      - "127.0.0.1:5984:5984"
    networks:
      - couchdb-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f -u $$COUCHDB_USER:$$COUCHDB_PASSWORD http://localhost:5984/_up"]
      interval: 30s
      timeout: 10s
      retries: 3

  cloudflared:
    # Pinned version — upgrade deliberately, see https://github.com/cloudflare/cloudflared/releases
    image: cloudflare/cloudflared:2026.8.2
    container_name: cloudflared-nas
    restart: unless-stopped
    # SECURITY: dedicated Docker network instead of network_mode: host.
    # cloudflared reaches CouchDB via the service name (couchdb:5984) inside
    # the network — not via the host network, which limits its reach to
    # just this one container instead of every port on the host.
    networks:
      - couchdb-internal
    command: tunnel --no-autoupdate run --url http://couchdb:5984
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      couchdb:
        condition: service_healthy

networks:
  couchdb-internal:
    driver: bridge

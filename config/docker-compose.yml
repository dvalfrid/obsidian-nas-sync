version: "3.8"

services:
  couchdb:
    image: couchdb:3.5.1
    container_name: couchdb-obsidian
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_ADMIN_USER}
      COUCHDB_PASSWORD: ${COUCHDB_ADMIN_PASSWORD}
    volumes:
      # Datavolym — lagras på NAS:en
      - /volume1/docker/couchdb-obsidian/data:/opt/couchdb/data
      # Konfigurationsfil — read-only för säkerhet
      - ./couchdb/local.ini:/opt/couchdb/etc/local.d/local.ini:ro
    # SÄKERHET: Lyssnar bara på localhost — ej åtkomlig utifrån
    # All extern trafik går via Cloudflare Tunnel (cloudflared-containern nedan)
    ports:
      - "127.0.0.1:5984:5984"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 30s
      timeout: 10s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-nas
    restart: unless-stopped
    # network_mode host behövs för att cloudflared ska nå couchdb på localhost
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      couchdb:
        condition: service_healthy
